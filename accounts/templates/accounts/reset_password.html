<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>

Reset Password

</h4>

</div>

<div class="card-body">

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>

New Password

</label>

<input

type="password"

name="password"

class="form-control"

required

>

</div>

<div class="mb-3">

<label>

Confirm Password

</label>

<input

type="password"

name="confirm"

class="form-control"

required

>

</div>

<div class="d-grid">

<button class="btn btn-success">

Update Password

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
