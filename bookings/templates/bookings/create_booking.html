{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Create Booking</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success"
            >
                Save Booking
            </button>
        </form>

    </div>
</div>

{% endblock %}
